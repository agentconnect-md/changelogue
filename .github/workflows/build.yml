name: Build & Push Image

# Builds the container image and publishes it to GHCR. This repo builds images
# only; deployment (Helm chart, cluster credentials, rollout) lives in a
# separate deployment repo, so this repo holds no cluster credentials.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/agentconnect-md/changelogue

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          TAGS="${IMAGE}:latest,${SHA_TAG}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Make the package public so it can be pulled without credentials.
      # Best-effort: ignored if already public or insufficient permissions.
      - name: Ensure package is public
        continue-on-error: true
        run: |
          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/changelogue/visibility" \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

